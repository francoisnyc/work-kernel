# incident@3 in a portal (desk@2), on a calendar open Monday to Friday,
# 09:00 to 17:00 UTC. kim opens a P1 at 10:00 (first response 1 working
# hour, resolution 4). Nobody answers in time: at 11:00 first response is
# marked breached, never before, and the incident's assignee at that moment
# (sam) is emailed once. sam answers late (missed). sam hands it to ana;
# at 14:00 resolution is breached and ana, the assignee then, is emailed.
# ana resolves it late (missed), and 120 hours later a timer closes it.
# kim sees her fields only, the resolution included once it is set, and
# none of the goals.
story: a goal is breached at its due instant and tells whoever is assigned then
author: drafted by Claude from incident@3's comments, design.md and scenario B; approval pending
day1: 2026-12-07   # a Monday

people:
  lea: {roles: [sla_admin, desk_agent]}
  sam: {roles: [desk_agent]}
  ana: {roles: [desk_agent]}
  kim: {customer: true}

names:
  first: sla_goal in inc where f_metric = first_response
  resolution: sla_goal in inc where f_metric = resolution

hide_values:
  sla_goal: [f_week, f_days_off, f_zone]

fakes:
  email.notify@1:
    - ok

given:
  - 'lea creates cal as calendar@1 with f_name = "office hours", f_zone = "UTC", f_week = ["mon 09:00-17:00", "tue 09:00-17:00", "wed 09:00-17:00", "thu 09:00-17:00", "fri 09:00-17:00"]'
  - lea creates policy as sla_policy@2 with f_name = "standard", f_first_response_s_p1 = 3600, f_first_response_s_p2 = 7200, f_first_response_s_p3 = 14400, f_first_response_s_p4 = 28800, f_resolution_s_p1 = 14400, f_resolution_s_p2 = 28800, f_resolution_s_p3 = 57600, f_resolution_s_p4 = 115200
  - lea creates portal as desk@2 with f_key = "IT", f_name = "IT portal"
  - lea links portal calendar cal
  - lea links portal sla_policy policy

steps:
  - day 1 10:00 kim creates inc as incident@3 in portal with f_title = "Nobody can log in", f_priority = P1
  - day 1 10:05 sam updates inc with f_assignee = sam
  - day 1 11:30 sam moves inc to in_progress
  - day 1 12:00 sam creates reply1 as reply@2 in inc with f_body = "Looking into it"
  - day 1 13:00 sam updates inc with f_assignee = ana
  - day 1 15:00 ana moves inc to resolved with f_resolution = workaround
  - day 1 15:00 kim sees inc fields f_priority, f_resolution, f_title
  - day 1 15:00 kim cannot see resolution

until: day 8 00:00

expect:
  - "day 1 10:00 inc: kim created it in new inside portal"
  - "day 1 10:00 inc: sla_start_first_response for kim applied to first"
  - "day 1 10:00 inc: sla_start_resolution for kim applied to resolution"
  - "day 1 10:00 first: sla_start_first_response for kim created it in running inside inc: f_due_at = day 1 11:00, f_metric = first_response, f_started_at = day 1 10:00, f_target_s = 3600, f_week = ..., f_zone = ..."
  - "day 1 10:00 first: show_first_response for kim applied to inc"
  - "day 1 10:00 inc: show_first_response for kim updated it: f_due_first_response = day 1 11:00"
  - "day 1 10:00 resolution: sla_start_resolution for kim created it in running inside inc: f_due_at = day 1 14:00, f_metric = resolution, f_started_at = day 1 10:00, f_target_s = 14400, f_week = ..., f_zone = ..."
  - "day 1 10:00 resolution: show_resolution for kim applied to inc"
  - "day 1 10:00 inc: show_resolution for kim updated it: f_due_resolution = day 1 14:00"
  - "day 1 10:05 inc: sam updated it"
  # First response breached at its due instant; sam is assigned, and told.
  - "day 1 11:00 first: timer for kim updated it (breached): f_breached_at = day 1 11:00"
  - "day 1 11:00 first: notify_breach for kim ran (breached)"
  - "day 1 11:00 email: notify for first (notify_breach): to = sam"
  - "day 1 11:30 inc: sam moved it new -> in_progress"
  # sam's reply, late: first response missed.
  - "day 1 12:00 reply1: sam created it in default inside inc"
  - "day 1 12:00 inc: sla_answered for sam applied to first"
  - "day 1 12:00 first: sla_answered for sam moved it running -> completed: f_breached_at = day 1 11:00, f_due_at = null, f_elapsed_s = 7200, f_outcome = missed"
  - "day 1 12:00 first: clear_first_response for sam applied to inc"
  - "day 1 12:00 inc: clear_first_response for sam updated it: f_due_first_response = null"
  - "day 1 13:00 inc: sam updated it"
  # Resolution breached; ana is assigned now, and told.
  - "day 1 14:00 resolution: timer for kim updated it (breached): f_breached_at = day 1 14:00"
  - "day 1 14:00 resolution: notify_breach for kim ran (breached)"
  - "day 1 14:00 email: notify for resolution (notify_breach): to = ana"
  # ana resolves it late: missed; 120 hours later the timer closes it.
  - "day 1 15:00 inc: ana moved it in_progress -> resolved"
  - "day 1 15:00 inc: sla_stop for ana applied to resolution"
  - "day 1 15:00 resolution: sla_stop for ana moved it running -> completed: f_breached_at = day 1 14:00, f_due_at = null, f_elapsed_s = 18000, f_outcome = missed"
  - "day 1 15:00 resolution: clear_resolution for ana applied to inc"
  - "day 1 15:00 inc: clear_resolution for ana updated it: f_due_resolution = null"
  - "day 6 15:00 inc: timer for ana moved it resolved -> closed"
