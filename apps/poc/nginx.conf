# The poc container (the PoC apps): the built site, and /api proxied to
# the item service, so the browser talks to one origin and the item
# service needs no CORS. The same as web/'s.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # The public API. The trailing slash on proxy_pass strips /api.
    location /api/ {
        proxy_pass http://itemservice:8080/;
        proxy_http_version 1.1;
        # A held transition waits up to 5 s for its check.
        proxy_read_timeout 30s;
    }

    # DEV ONLY: the dev-token file, for the sign-in screen. It is not in
    # the image: the compose stack mounts it here, read-only. Anyone who
    # can reach this port can act as every principal in it, which is why
    # compose publishes the port on 127.0.0.1 only.
    location = /dev-tokens.yaml {
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
