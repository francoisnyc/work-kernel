# Dev tokens for the proof of concept: the ONLY auth there is. Anyone holding
# this file can act as every principal in it, so the item service warns on
# every start that uses it. Never expose a server that runs with it.
#
# Each token is one principal in one namespace; `pli --as NAME` picks one.
# roles: what the principal holds in that namespace (added at start, never
# removed). grants: what a user lets an agent do. display_name: an agent's
# name on screens (the web Inbox), until sign-on brings real names.
tokens:
  # acme: seven users and an agent (lea and sam work in the PLAT software
  # project; ana watches it). In the HR directory
  # (deploy/hr-directory.json) ana reports to bob, bob to dana, and dana to
  # herself; erin is not in it. hana is HR: she alone writes who owns a
  # leave balance and its allowance (role hr_admin). lea runs the IT service
  # desk: she alone links a desk to its calendar and its SLA policy, and
  # writes the policy's targets (role sla_admin). lea and sam answer the
  # desk's customers (role desk_agent). lea also sets up the resources
  # people ask access to: who approves and how many must (role
  # access_admin). sam may migrate a ticket of an older version to
  # ticket@9 (role ticket_admin).
  - {name: ana, token: dev-ana-not-a-secret, principal: "user:ana", namespace: acme}
  - {name: bob, token: dev-bob-not-a-secret, principal: "user:bob", namespace: acme, roles: [approver]}
  - {name: dana, token: dev-dana-not-a-secret, principal: "user:dana", namespace: acme}
  - {name: erin, token: dev-erin-not-a-secret, principal: "user:erin", namespace: acme}
  - {name: hana, token: dev-hana-not-a-secret, principal: "user:hana", namespace: acme, roles: [hr_admin]}
  - {name: lea, token: dev-lea-not-a-secret, principal: "user:lea", namespace: acme, roles: [sla_admin, desk_agent, access_admin]}
  - {name: sam, token: dev-sam-not-a-secret, principal: "user:sam", namespace: acme, roles: [desk_agent, ticket_admin]}
  # Two customers of the IT desk (Jira part 2, step 4a): they open incidents
  # in its portal and see their own, and nothing else. A customer never
  # holds a role.
  - {name: kim, token: dev-kim-not-a-secret, principal: "customer:kim", namespace: acme}
  - {name: lee, token: dev-lee-not-a-secret, principal: "customer:lee", namespace: acme}
  - {name: triage-bot, token: dev-triage-bot-not-a-secret, principal: "agent:triage-bot", namespace: acme, display_name: Triage agent}
  # The portal's bot: it acts for a customer, with a customer's powers.
  - {name: portal-bot, token: dev-portal-bot-not-a-secret, principal: "agent:portal-bot", namespace: acme, display_name: Portal agent}
  # globex: another namespace, which sees nothing of acme.
  - {name: carol, token: dev-carol-not-a-secret, principal: "user:carol", namespace: globex}

grants:
  # ana lets triage-bot work anywhere in acme. A session asks for less: the
  # scopes and powers it needs.
  - agent: "agent:triage-bot"
    user: "user:ana"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, edit_fields, "transition:*", move]
  # bob lets triage-bot work anywhere in acme too: an agent acting for the
  # approver still cannot approve (an approval names user:bob, never the agent).
  - agent: "agent:triage-bot"
    user: "user:bob"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, edit_fields, "transition:*", move]
  # kim and lee let the portal bot act for them, with a customer's fixed
  # powers: read, create, comment and their own moves.
  - agent: "agent:portal-bot"
    user: "customer:kim"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, comment, "transition:*"]
  - agent: "agent:portal-bot"
    user: "customer:lee"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, comment, "transition:*"]
