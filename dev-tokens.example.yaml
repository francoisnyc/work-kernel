# Dev tokens for the proof of concept: the ONLY auth there is. Anyone holding
# this file can act as every principal in it, so the item service warns on
# every start that uses it. Never expose a server that runs with it.
#
# Each token is one principal in one namespace; `pli --as NAME` picks one.
# roles: what the principal holds in that namespace (added at start, never
# removed). grants: what a user lets an agent do.
tokens:
  # acme: five users and an agent. In the HR directory
  # (deploy/hr-directory.json) ana reports to bob, bob to dana, and dana to
  # herself; erin is not in it. hana is HR: she alone writes who owns a
  # leave balance and its allowance (role hr_admin).
  - {name: ana, token: dev-ana-not-a-secret, principal: "user:ana", namespace: acme}
  - {name: bob, token: dev-bob-not-a-secret, principal: "user:bob", namespace: acme, roles: [approver]}
  - {name: dana, token: dev-dana-not-a-secret, principal: "user:dana", namespace: acme}
  - {name: erin, token: dev-erin-not-a-secret, principal: "user:erin", namespace: acme}
  - {name: hana, token: dev-hana-not-a-secret, principal: "user:hana", namespace: acme, roles: [hr_admin]}
  - {name: triage-bot, token: dev-triage-bot-not-a-secret, principal: "agent:triage-bot", namespace: acme}
  # globex: another namespace, which sees nothing of acme.
  - {name: carol, token: dev-carol-not-a-secret, principal: "user:carol", namespace: globex}

grants:
  # ana lets triage-bot work anywhere in acme. A session asks for less: the
  # scopes and powers it needs.
  - agent: "agent:triage-bot"
    user: "user:ana"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, edit_fields, "transition:*", move]
  # bob lets triage-bot work anywhere in acme too: an agent acting for the
  # approver still cannot approve (an approval names user:bob, never the agent).
  - agent: "agent:triage-bot"
    user: "user:bob"
    namespace: acme
    scopes: [namespaces/acme]
    powers: [read, create, edit_fields, "transition:*", move]
