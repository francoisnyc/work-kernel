# Runs on every pull request and on pushes to main.
# GitHub's Ubuntu runners include Docker, which testcontainers needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # buf needs a newer Go patch release than go.mod names; "auto" lets the
      # go command fetch it.
      - name: Lint the proto
        env:
          GOTOOLCHAIN: auto
        run: make lint

      - name: Generated code is current
        env:
          GOTOOLCHAIN: auto
        run: |
          make gen
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "gen/ is out of date: run make gen and commit the result"
            git status --porcelain -- gen/
            git diff -- gen/ | head -50
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...
