# Runs on every pull request and on pushes to main.
# GitHub's Ubuntu runners include Docker, which testcontainers needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Generated code (gen/) is not held to gofmt: "buf generate leaves gen/
      # unchanged" below guards that directory.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' | grep -v '^gen/' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # buf needs a newer Go patch release than go.mod names; "auto" lets the
      # go command fetch it.
      - name: Lint the proto
        env:
          GOTOOLCHAIN: auto
        run: make lint

      - name: Generated code is current
        env:
          GOTOOLCHAIN: auto
        run: |
          make gen
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "gen/ is out of date: run make gen and commit the result"
            git status --porcelain -- gen/
            git diff -- gen/ | head -50
            exit 1
          fi

      # Pull requests only: kernel.v1 only grows. WIRE_JSON (buf.yaml) also
      # holds JSON field names and enum names, which clients match.
      - name: The proto stays compatible with the base branch
        if: github.event_name == 'pull_request'
        env:
          GOTOOLCHAIN: auto
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          make breaking BREAKING_AGAINST=".git#ref=refs/remotes/origin/$BASE"

      # Pull requests only: a published action contract never changes
      # (Ventoux V1). Every line of the base branch's contracts/contracts.lock
      # must be in this one, unchanged; a new line publishes a contract. A
      # base branch without a lock yet has published nothing.
      - name: Published action contracts stay frozen
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if git cat-file -e "refs/remotes/origin/$BASE:contracts/contracts.lock" 2>/dev/null; then
            git show "refs/remotes/origin/$BASE:contracts/contracts.lock" >"$RUNNER_TEMP/base.lock"
          else
            echo "The base branch has no contracts.lock yet: nothing published to compare."
            : >"$RUNNER_TEMP/base.lock"
          fi
          go run ./cmd/contractsfrozen "$RUNNER_TEMP/base.lock" contracts/contracts.lock

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  # The web UI (web/): its generated client is current, it typechecks, its
  # unit tests pass (the rank port against Go's golden vectors among them)
  # and it builds.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # buf runs through `go run`, as in the test job.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/poc/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # protoc-gen-es is the one package-lock.json pins.
      - name: Generated TypeScript client is current
        env:
          GOTOOLCHAIN: auto
        run: |
          make gen-web
          if [ -n "$(git status --porcelain -- web/src/gen)" ]; then
            echo "web/src/gen is out of date: run make gen-web and commit the result"
            git status --porcelain -- web/src/gen
            git diff -- web/src/gen | head -50
            exit 1
          fi

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # The PoC apps (apps/poc): they read web/'s generated client and rank
      # port (just checked above) read-only.
      - name: PoC apps, install
        working-directory: apps/poc
        run: npm ci

      - name: PoC apps, typecheck
        working-directory: apps/poc
        run: npm run typecheck

      - name: PoC apps, unit tests
        working-directory: apps/poc
        run: npm test

      # A build without VITE_DEV_USERS has no sign-in list: no dev-token
      # fetch and no YAML parser in the bundle.
      - name: PoC apps, build (no dev users in it)
        working-directory: apps/poc
        run: |
          npm run build
          if grep -l -E 'dev-tokens|YAMLParseError|Sign in as' dist/assets/*.js; then
            echo "the build without VITE_DEV_USERS contains dev-user code"
            exit 1
          fi

  # The Step 0 scenario against the whole compose stack, through pli only;
  # then the web UI's browser smoke test against the same stack.
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: The images build with go.mod's Go
        run: |
          want=$(awk '$1 == "go" { print $2 }' go.mod)
          got=$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)
          if [ "$want" != "$got" ]; then
            echo "Dockerfile has GO_VERSION=$got, go.mod has go $want"
            exit 1
          fi

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Run the scenario
        run: ./scripts/scenario.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/poc/package-lock.json

      - name: Install the browser test and its browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Against the stack the scenario just used: http://localhost:8090.
      - name: Browser smoke test
        working-directory: web
        run: npm run e2e

      # The PoC apps' journeys (lea on the board, sam working an incident,
      # kim in the portal) against the same stack: http://localhost:8091.
      # The same Playwright version as web/, so its browser is already here.
      - name: PoC apps, install the journeys and their browser
        working-directory: apps/poc
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: PoC apps, journeys
        working-directory: apps/poc
        run: npm run e2e

      - name: Upload the browser test's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            web/test-results/
            apps/poc/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down -v
