# The work an approved access request leaves for the desk (Jira 2.4b): made
# inside the request when it is approved, naming its resource. Desk agents
# find it by its Type and state, and take it through. One made by hand names
# no resource: refused (resource_missing).
id: fulfilment_task
version: 1
initial_state: open

fields:
  - id: f_resource
    type: string
    writable_by: kernel
  - id: f_assignee
    type: principal

states:
  - id: open
    category: todo
  - id: in_progress
    category: active
  - id: done
    category: done

transitions:
  - from: open
    to: in_progress
    allowed: ['role:desk_agent']
  - from: in_progress
    to: done
    allowed: ['role:desk_agent']

invariants:
  - id: resource_missing
    rule: 'f_resource != null'

accepts_reactions:
  'access_request:fulfil':
    creates: [f_resource]
