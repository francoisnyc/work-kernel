# approval@3 (the Inbox, the look): approval@2 with the Type's own label
# (label: Approval), and nothing else changed. A hint enforces nothing.
# Like approval@2 it has no start block: only a request's reaction creates
# an approval, and a reaction is not judged by start. access_request@2 to
# @4 still create approval@2; screens name it by this version's label.
# The text below is approval@2's.
#
# approval@2 (the Inbox for people, PR 1b): approval@1 with words for
# people (presentation hints: labels, a primary move), and nothing else
# changed. Hints enforce nothing. access_request@2 creates this version;
# access_request@1 still creates approval@1. The text below is approval@1's.
#
# One approver's decision on an access request (Jira 2.4b), made by the
# request on submit, one per approver (for_each). Contained in its request,
# whose readers it shares.
#
#   - Only its approver decides it, never whoever created the request
#     (except: [container_creator]), and only while the request is pending.
#   - Its approver, or access_admin, hands it over in place: pending ->
#     pending sets f_approver from f_delegate. To someone who already holds
#     a pending or approved approval on the same request is NOT_UNIQUE; to
#     oneself, GUARD_FAILED. A delegate set any other way breaks the
#     invariant delegate_not_approver.
#   - A decision moves the request (target: container). The request's own
#     guards count its approvals, so it moves once: until enough approvals
#     have decided, the move is a skip (on_guard: skip), not a failure.
#   - Nobody cancels one by hand: the request closes the leftovers.
#   - Nobody moves or narrows one: it stays in the request it was made in.
id: approval
version: 3
label: Approval
initial_state: pending

fields:
  - id: f_title  # the request's, for the Inbox
    type: string
    writable_by: kernel
    label: Request
  - id: f_approver
    type: principal
    writable_by: kernel
    unique_among_siblings: [pending, approved]
    label: Approver
  - id: f_delegate
    type: principal
    label: Hand over to

states:
  - id: pending
    category: active
    label: Waiting for a decision
  - id: approved
    category: done
    label: Approved
  - id: rejected
    category: done
    label: Rejected
  - id: canceled
    category: canceled
    label: Closed

transitions:
  - from: pending
    to: approved
    guard: 'container.state == "pending"'
    allowed: ['field:f_approver']
    except: [container_creator]
    label: Approve
    primary: true
  - from: pending
    to: rejected
    guard: 'container.state == "pending"'
    allowed: ['field:f_approver']
    except: [container_creator]
    label: Reject
  # The hand-over.
  - from: pending
    to: pending
    guard: 'container.state == "pending" && f_delegate != f_approver'
    required: [f_delegate]
    allowed: ['field:f_approver', 'role:access_admin']
    except: [container_creator]
    sets:
      f_approver: 'f_delegate'
    label: Hand over
  - from: pending
    to: canceled
    allowed: [nobody]

reactions:
  - id: move_approved
    kind: move
    on: enter
    state: approved
    to: approved
    on_guard: skip
    target: container
    target_from: [pending]
  - id: move_rejected
    kind: move
    on: enter
    state: rejected
    to: rejected
    on_guard: skip
    target: container
    target_from: [pending]

invariants:
  - id: approver_missing
    rule: 'f_approver != null'
  - id: delegate_not_approver
    rule: 'f_delegate == null || f_delegate == f_approver'

accepts_reactions:
  'access_request:request_approvals':
    creates: [f_approver, f_title]
  'access_request:close_on_approved':
    moves: [canceled]
  'access_request:close_on_rejected':
    moves: [canceled]
  'access_request:close_on_withdrawn':
    moves: [canceled]

placement_writable_by: [kernel]
