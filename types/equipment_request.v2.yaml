# equipment_request@2 (the Inbox for people, PR 1b): equipment_request@1
# with words for people (labels, a primary move out of each state a desk
# agent works in), and nothing else changed. Hints enforce nothing.
# start.older_versions keeps version 1 open for the tests, journeys and
# scenario that still create it. The text below is equipment_request@1's.
#
# equipment_request: someone asks the desk for equipment; the desk agents
# take requests from a shared queue.
#
# The first Type in types/ with a claim (track 1 item 5, step 2): a desk
# agent who takes a request from the queue claims it (f_handler names
# them), and only they fulfil or decline it. They can hand it back to the
# queue (a release), where any desk agent can take it again.
id: equipment_request
version: 2
initial_state: queue

fields:
  - {id: f_title,   type: string, label: What is needed}
  - {id: f_handler, type: principal, writable_by: ['role:desk_agent'], label: Handled by}

states:
  - {id: queue,     category: waiting, label: In the queue}
  - {id: in_hand,   category: active, claim: f_handler, label: Being handled}
  - {id: fulfilled, category: done, label: Fulfilled}
  - {id: declined,  category: canceled, label: Declined}
  - {id: withdrawn, category: canceled, label: Withdrawn}

transitions:
  # A desk agent takes it: the claim. Not the person who asked.
  - {from: queue,   to: in_hand,   allowed: ['role:desk_agent'], except: [creator], label: Take it, primary: true}
  # The claimant decides, or hands it back to the queue.
  - {from: in_hand, to: fulfilled, allowed: ['role:desk_agent'], label: Mark fulfilled, primary: true}
  - {from: in_hand, to: declined,  allowed: ['role:desk_agent'], label: Decline}
  - {from: in_hand, to: queue,     allowed: ['role:desk_agent'], release: true, clears: [f_handler], label: Hand back}
  # Whoever asked can withdraw it while nobody has taken it.
  - {from: queue,   to: withdrawn, allowed: [creator], label: Withdraw}

start:
  older_versions: [1]
