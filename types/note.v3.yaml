# note@3 (track 1, item 6, step 1: a create names the latest version):
# note@2 with one line added, start.older_versions: all, and nothing else
# changed. Once a newer version of a Type is registered, its older versions
# are closed to new Items unless the newest one lists them. This version
# keeps every older version of note open, for the tests, stories, scenario
# and apps that still create them. The text below is note@2's.
#
# A note, version 2 (the hardening step after Jira 2.4): version 1,
# placed by the kernel only: a note stays in the incident it was written in;
# nobody moves or narrows it.
#
# An internal note (Jira part 2, step 4a): staff only, because no Type
# shares it.
id: note
version: 3
fields:
  - {id: f_body, type: string}

placement_writable_by: [kernel]

start:
  older_versions: all
