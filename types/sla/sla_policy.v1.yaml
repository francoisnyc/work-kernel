# An SLA policy (the `sla` package; see README.md): how long each kind of
# goal may take, in seconds of working time, for each priority P1 to P4.
#
#   - Only holders of the role sla_admin write a target. Whoever asks for
#     work never chooses how long it may take.
#   - A target is a positive number of seconds, or not set.
#   - The reaction that starts a goal reads the target of its host's
#     priority and copies it onto the goal: changing a policy changes no
#     running goal (recomputing is Later).
id: sla_policy
version: 1

fields:
  - {id: f_name,                type: string}
  - {id: f_first_response_s_p1, type: int, writable_by: ['role:sla_admin']}
  - {id: f_first_response_s_p2, type: int, writable_by: ['role:sla_admin']}
  - {id: f_first_response_s_p3, type: int, writable_by: ['role:sla_admin']}
  - {id: f_first_response_s_p4, type: int, writable_by: ['role:sla_admin']}
  - {id: f_resolution_s_p1,     type: int, writable_by: ['role:sla_admin']}
  - {id: f_resolution_s_p2,     type: int, writable_by: ['role:sla_admin']}
  - {id: f_resolution_s_p3,     type: int, writable_by: ['role:sla_admin']}
  - {id: f_resolution_s_p4,     type: int, writable_by: ['role:sla_admin']}

readable_by_reactions:
  - f_first_response_s_p1
  - f_first_response_s_p2
  - f_first_response_s_p3
  - f_first_response_s_p4
  - f_resolution_s_p1
  - f_resolution_s_p2
  - f_resolution_s_p3
  - f_resolution_s_p4

invariants:
  - id: target_not_positive
    rule: >-
      (f_first_response_s_p1 == null || f_first_response_s_p1 > 0) &&
      (f_first_response_s_p2 == null || f_first_response_s_p2 > 0) &&
      (f_first_response_s_p3 == null || f_first_response_s_p3 > 0) &&
      (f_first_response_s_p4 == null || f_first_response_s_p4 > 0) &&
      (f_resolution_s_p1 == null || f_resolution_s_p1 > 0) &&
      (f_resolution_s_p2 == null || f_resolution_s_p2 > 0) &&
      (f_resolution_s_p3 == null || f_resolution_s_p3 > 0) &&
      (f_resolution_s_p4 == null || f_resolution_s_p4 > 0)
