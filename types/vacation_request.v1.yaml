# The vacation request (proof of concept, Step 2, part 1): a Bonita-style
# approval as a business state, built from generic kernel primitives. Nothing
# in the kernel is named "approval".
#
#   - draft -> submitted runs the HR check (hr.manager_of): it reads who the
#     request is for (created_on_behalf_of, else created_by) and either
#     corrects f_approver to their manager on the way into submitted, or
#     denies (unknown_employee, no_eligible_approver).
#   - f_approver is written by the kernel only: the public door refuses it.
#   - The request's terms and its approver are frozen once submitted, and stay
#     frozen once approved or rejected, so what was approved is what stands.
#   - The manager decides by an ordinary transition: allowed to whoever
#     f_approver names, never to the requester (the guard), and an agent
#     acting for the manager does not pass `allowed` (only user:<manager> does).
#   - To change a pending request: recall it to draft, edit, submit again.
id: vacation_request
version: 1
initial_state: draft

fields:
  - {id: f_start,      type: date}
  - {id: f_end,        type: date}
  - {id: f_days,       type: int}
  - {id: f_leave_type, type: enum, options: [annual, unpaid, other]}
  - {id: f_approver,   type: principal, writable_by: kernel}
  - {id: f_comment,    type: string}

states:
  - {id: draft,     category: todo}
  - id: submitted
    category: waiting
    frozen: [f_start, f_end, f_days, f_leave_type, f_approver]
  - id: approved
    category: done
    frozen: [f_start, f_end, f_days, f_leave_type, f_approver]
  - id: rejected
    category: canceled
    frozen: [f_start, f_end, f_days, f_leave_type, f_approver]
  - {id: withdrawn, category: canceled}

transitions:
  # Submit: the terms make sense and the leave has not started.
  - from: draft
    to: submitted
    required: [f_start, f_end, f_days, f_leave_type]
    guard: 'f_end >= f_start && f_start >= today && f_days > 0'
  # The manager's decision. Whoever f_approver names, never the requester
  # (nor anyone acting for them). caller_on_behalf_of is null for a user
  # acting as themselves, and null == null holds in CEL: test it first.
  - from: submitted
    to: approved
    allowed: ['field:f_approver']
    guard: >-
      caller != created_by && caller != created_on_behalf_of &&
      (caller_on_behalf_of == null ||
       (caller_on_behalf_of != created_by && caller_on_behalf_of != created_on_behalf_of))
  - from: submitted
    to: rejected
    allowed: ['field:f_approver']
    guard: >-
      caller != created_by && caller != created_on_behalf_of &&
      (caller_on_behalf_of == null ||
       (caller_on_behalf_of != created_by && caller_on_behalf_of != created_on_behalf_of))
  # The requester (or an agent acting for them) recalls a pending request to
  # edit it, or withdraws it. A withdrawal from draft is an escape: it ends
  # an open HR check.
  - from: submitted
    to: draft
    guard: &requester >-
      caller == created_by || caller == created_on_behalf_of ||
      (caller_on_behalf_of != null &&
       (caller_on_behalf_of == created_by || caller_on_behalf_of == created_on_behalf_of))
  - from: submitted
    to: withdrawn
    guard: *requester
  - from: draft
    to: withdrawn
    escape: true
    guard: *requester

hooks:
  - id: hr_check
    on: transition
    from: draft
    to: submitted
    kind: check
    action: hr.manager_of
    reads: [created_on_behalf_of, created_by]
    writes: [f_approver]
