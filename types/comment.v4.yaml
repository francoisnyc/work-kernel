# comment@4 (track 1, item 6, step 1: a create names the latest version):
# comment@3 with one line added, start.older_versions: all, and nothing else
# changed. Once a newer version of a Type is registered, its older versions
# are closed to new Items unless the newest one lists them. This version
# keeps every older version of comment open, for the tests, stories, scenario
# and apps that still create them. The text below is comment@3's.
#
# A comment, version 3 (the hardening step after Jira 2.4): version 2,
# placed by the kernel only: a comment stays where it was written;
# nobody moves or narrows it.
#
# A comment, version 2 (Jira part 2, step 2): f_public says whether the
# people the Item is for may see it as an answer to them. Still no
# lifecycle, no reaction and nothing listening: what a comment does to the
# Item it is made in is that Item's Type to say (ticket@6's `reopen`).
id: comment
version: 4
fields:
  - {id: f_body,   type: string}
  - {id: f_public, type: bool}

placement_writable_by: [kernel]

start:
  older_versions: all
