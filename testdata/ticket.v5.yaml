# Version 5 of the ticket (proof of concept, Step 1): v4 plus links and a
# principal field.
#   - blocks / blocked_by: many to many, between tickets of any version.
#   - duplicate_of / duplicates: at most one from a ticket.
#   - f_assignee holds a principal (user:<id> or agent:<id>), not free text.
#   - A ticket cannot be resolved while something that is neither done nor
#     canceled blocks it.
# Phase B keeps this file in testdata/; Phase C moves it to types/.
id: ticket
version: 5
initial_state: triage

fields:
  - {id: f_title,       type: string}
  - {id: f_priority,    type: int}
  - {id: f_reporter,    type: string}
  - {id: f_assignee,    type: principal}
  - {id: f_urgent,      type: bool}
  - {id: f_resolution,  type: enum, options: [fixed, wontfix, duplicate]}
  - {id: f_customer_id, type: string}
  - {id: f_plan,        type: enum, options: [free, pro, enterprise, unknown]}
  - {id: f_on_hold,     type: bool}
  - {id: f_amount,      type: int}
  - {id: f_cost_center, type: string}
  - {id: f_invoice_id,  type: string}

links:
  - {name: blocks,       inverse: blocked_by, targets: [ticket]}
  - {name: duplicate_of, inverse: duplicates, targets: [ticket], max: one}

states:
  - {id: triage,      category: triage}
  - {id: open,        category: todo}
  - {id: in_progress, category: active,  timer: {after: 24h, to: open}}
  - {id: waiting,     category: waiting, timer: {after: 72h, to: in_progress}}
  - {id: approved,    category: active}
  - {id: resolved,    category: done}
  - {id: canceled,    category: canceled}

transitions:
  - {from: triage, to: open}
  - {from: triage, to: canceled}
  - from: open
    to: in_progress
    guard: 'f_assignee != null'
  - {from: in_progress, to: open}
  - {from: in_progress, to: waiting}
  - {from: waiting, to: in_progress}
  - from: in_progress
    to: approved
    required: [f_customer_id, f_amount]
    guard: 'f_on_hold != true'
    allowed: ['role:approver']
  - {from: in_progress, to: canceled, escape: true}
  # Close: not while blocked by a ticket that is neither done nor canceled.
  - from: in_progress
    to: resolved
    required: [f_resolution]
    guard: 'links.blocked_by.all(b, b.category in ["done", "canceled"])'
  - from: approved
    to: resolved
    required: [f_resolution]
    guard: 'links.blocked_by.all(b, b.category in ["done", "canceled"])'
  - from: resolved
    to: open
    guard: 'f_resolution != "wontfix"'
  - {from: open, to: canceled}

hooks:
  - id: get_plan
    on: enter
    state: triage
    kind: enrich
    action: crm.get_plan
    reads: [f_customer_id]
    writes: [f_plan]
    fallback: {f_plan: unknown}
  - id: get_credit_status
    on: enter
    state: triage
    kind: enrich
    action: erp.get_credit_status
    reads: [f_customer_id]
    writes: [f_on_hold]
  - id: erp_check
    on: transition
    from: in_progress
    to: approved
    kind: check
    action: erp.check_credit
    reads: [f_customer_id, f_amount]
    writes: [f_cost_center]
  - id: create_invoice
    on: enter
    state: approved
    kind: action
    action: erp.create_invoice
    reads: [f_customer_id, f_amount]
    writes: [f_invoice_id]
