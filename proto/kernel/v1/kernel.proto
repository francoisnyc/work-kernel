syntax = "proto3";

// Public API of the Work kernel, version 1. See "Public API (v1)" in
// docs/design.md: this file is that section as a contract.
//
// - Who is calling comes from the bearer token, never from a request field.
//   No request carries a principal or an on_behalf_of.
// - Names carry the namespace: namespaces/{ns}/items/{item},
//   namespaces/{ns}/types/{type}/versions/{n}. A name in a namespace the
//   caller is not in answers NOT_FOUND, like a hidden Item.
// - Every write takes a required request_id (the idempotency key) and returns
//   the Item after the write, with item_seq and commit_seq.
// - Errors carry a standard code and a google.rpc.ErrorInfo with a stable
//   reason (domain "pli.francoisnyc.github.io", frozen); see the error table
//   in docs/design.md.
//
// - Reads page: page_size (default 50, max 500; more is read as 500),
//   page_token from the previous page's next_page_token, no offsets and no
//   totals. A page_token is bound to its request, caller and namespace:
//   sent with any other request it is INVALID_ARGUMENT.
// - An agent calls with its own token and the session's ID in the
//   Pli-Agent-Session header (StartAgentSession mints it). The header with a
//   user's token, or an agent's token without it, is INVALID_ARGUMENT; an
//   unknown session, or another agent's or another namespace's, is
//   UNAUTHENTICATED / SESSION_INVALID.
//
// kernel.v1 only grows. Links and principal fields arrived in Step 1 of
// the proof of concept.
package kernel.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/francoisnyc/work-kernel/gen/kernel/v1;kernelv1";

service ItemService {
  // Create an Item of a Type version, optionally in a container and narrowed.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  // One Item as the caller sees it. Hidden and missing are the same answer.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // A field patch, a readers change or a move.
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  // Move the Item to another state, optionally with a field patch and a wait.
  rpc TransitionItem(TransitionItemRequest) returns (TransitionItemResponse);
  // Items whose string fields contain all the words and that match the
  // filter, among those the caller can see. Words, a filter or both.
  rpc SearchItems(SearchItemsRequest) returns (SearchItemsResponse);
  // A container's direct children (or the top-level Items), with the same
  // filters as SearchItems.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // An Item's history, oldest first, as the caller may see it.
  rpc ListItemEvents(ListItemEventsRequest) returns (ListItemEventsResponse);
  // One Type version. Types are read-only: they load from files at start.
  rpc GetType(GetTypeRequest) returns (GetTypeResponse);
  // Every Type version the server knows.
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse);
  // Called with an agent's token: mint a session in capability mode, with
  // the scopes it may touch and the powers it may use. Later calls carry its
  // ID in the Pli-Agent-Session header.
  rpc StartAgentSession(StartAgentSessionRequest) returns (StartAgentSessionResponse);
  // Called with a user's token: approve one wider scope for an agent session
  // acting for that user (the answer to NEEDS_APPROVAL).
  rpc ApproveWiden(ApproveWidenRequest) returns (ApproveWidenResponse);

  // Add a link of a type the source's Type declares, from the source Item
  // (name) to a target. The event, the item_seq and the etag are the
  // source's only. The caller must see both Items (else NOT_FOUND).
  rpc LinkItems(LinkItemsRequest) returns (LinkItemsResponse);
  // Remove a link, with the same rules as LinkItems.
  rpc UnlinkItems(UnlinkItemsRequest) returns (UnlinkItemsResponse);
}

// An Item as the caller may see it.
message Item {
  // namespaces/{ns}/items/{item}. Flat: a move never renames an Item.
  string name = 1;
  // namespaces/{ns}/types/{type}/versions/{n}: the version the Item was
  // created with, pinned for its life.
  string type = 2;
  // The containing Item's name; empty at the top level.
  string container = 3;
  // The current lifecycle state.
  string state = 4;
  // Field values keyed by stable field ID, as plain JSON: strings, numbers,
  // booleans; an int is a string (int64 does not fit a JSON number); an enum
  // is its option's name. Unset fields are absent.
  google.protobuf.Struct fields = 5;
  // Opaque. Send it back on a write to refuse the write if the Item moved on.
  string etag = 6;
  // The open hold, if any: a checked transition waiting for its check.
  Hold hold = 7;
  // When the Item was created.
  google.protobuf.Timestamp create_time = 8;
  // Who created it (its first event's actor): user:tom, agent:triage-bot.
  string creator = 9;
  // The user the creator acted for, when an agent created it; else empty.
  string creator_on_behalf_of = 10;
  // The current state's category in the Item's Type version.
  StateCategory category = 11;
  // Links in both directions, outgoing first, at most 200 per direction
  // (restricted ones count). Filled by GetItem and by every write's answer;
  // Items in SearchItems and ListItems carry none. An outgoing link whose
  // target the caller cannot see is restricted; an incoming link whose
  // source the caller cannot see is left out.
  repeated Link links = 12;
  // More links exist in some direction than are shown: page through them
  // with an ItemFilter link condition.
  bool links_truncated = 13;
}

// One link of an Item, as seen from that Item.
message Link {
  // The name as this Item sees it: the declared name when OUTGOING
  // (blocks), the inverse name when INCOMING (blocked_by).
  string link_type = 1;
  LinkDirection direction = 2;
  // The Item at the other end; restricted when the caller cannot see it.
  ItemRef item = 3;
}

enum LinkDirection {
  LINK_DIRECTION_UNSPECIFIED = 0;
  // From this Item: it is the link's source.
  LINK_DIRECTION_OUTGOING = 1;
  // To this Item: it is the link's target.
  LINK_DIRECTION_INCOMING = 2;
}

// Another Item named in an Item's history (later, in its links). One the
// caller cannot see is restricted, with no name.
message ItemRef {
  // namespaces/{ns}/items/{item}; empty when restricted.
  string name = 1;
  bool restricted = 2;
}

// A requested transition, held while its check runs.
message Hold {
  // namespaces/{ns}/items/{item}/holds/{hold}
  string name = 1;
  // The check hook's ID in the Item's Type.
  string check = 2;
  // The state the Item is held in.
  string from_state = 3;
  // The state requested.
  string requested_state = 4;
}

// A list of principals, as typed IDs (user:ana, agent:bot).
message Readers {
  repeated string principals = 1;
}

message CreateItemRequest {
  // namespaces/{ns}: the caller's namespace.
  string parent = 1;
  // Required. The same request_id with the same request returns the stored
  // result; with a different request it is ALREADY_EXISTS.
  string request_id = 2;
  // Required. namespaces/{ns}/types/{type}/versions/{n}.
  string type = 3;
  // Optional: the containing Item's name.
  string container = 4;
  // Optional initial values; null is not a value here.
  google.protobuf.Struct fields = 5;
  // Optional: give the Item its own scope, readable only by these readers
  // (who can also read the container). Must include the caller.
  Readers narrow = 6;
}

message CreateItemResponse {
  Item item = 1;
  int64 item_seq = 2;
  int64 commit_seq = 3;
}

message GetItemRequest {
  // namespaces/{ns}/items/{item}
  string name = 1;
}

message GetItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  // namespaces/{ns}/items/{item}
  string name = 1;
  // Required; see CreateItemRequest.request_id.
  string request_id = 2;
  // Optional if-match: refuse with ABORTED / STALE unless the Item is still
  // at this etag.
  string etag = 3;
  // A patch: changes only the fields it names; null clears a field.
  google.protobuf.Struct fields = 4;
  // A change of who may read the Item.
  PolicyChange policy = 5;
  // A change of the Item's container.
  Move move = 6;
  // At least one of fields, policy and move; not policy and move together.
}

// Narrow the Item to these readers, or drop its own scope and inherit its
// container's readers again. Exactly one.
message PolicyChange {
  oneof change {
    Readers narrow = 1;
    bool inherit = 2;
  }
}

message Move {
  // The new container's name; empty moves the Item to the top level.
  string container = 1;
  // Required when the move lets more people see anything in the moved
  // subtree; without it such a move is INVALID_ARGUMENT.
  bool confirm_widen = 2;
}

message UpdateItemResponse {
  Item item = 1;
  int64 item_seq = 2;
  int64 commit_seq = 3;
}

message TransitionItemRequest {
  // namespaces/{ns}/items/{item}
  string name = 1;
  // Required; see CreateItemRequest.request_id.
  string request_id = 2;
  // Optional if-match, as on UpdateItemRequest.
  string etag = 3;
  // Required: the state to move to.
  string to_state = 4;
  // Optional patch, as on UpdateItemRequest. Guards see the patched fields.
  google.protobuf.Struct fields = 5;
  // For a checked transition: how long to wait for the check, 0 (the
  // default) to 5 s. Not part of the request's identity: a retry with the
  // same request_id may wait more or less, and reports the current outcome.
  google.protobuf.Duration wait = 6;
}

message TransitionItemResponse {
  Item item = 1;
  // For a held transition: the resolving event once there is one, else the
  // request's.
  int64 item_seq = 2;
  int64 commit_seq = 3;
  TransitionOutcome outcome = 4;
  // DENIED and ERROR: a code in UPPER_SNAKE, e.g. CUSTOMER_ON_HOLD.
  string reason = 5;
  // The hold's name, when the transition was held.
  string hold = 6;
}

enum TransitionOutcome {
  TRANSITION_OUTCOME_UNSPECIFIED = 0;
  // The Item moved.
  TRANSITION_OUTCOME_APPLIED = 1;
  // The check, or a re-check of the requester, said no. A successful call.
  TRANSITION_OUTCOME_DENIED = 2;
  // The hold is still open; ask again with the same request_id.
  TRANSITION_OUTCOME_PENDING = 3;
  // The check could not answer; ask again to retry.
  TRANSITION_OUTCOME_ERROR = 4;
}

message SearchItemsRequest {
  // namespaces/{ns}
  string parent = 1;
  // Words; an Item must contain all of them. Optional when the filter says
  // something; words, a filter or both are required.
  string query = 2;
  // Optional read-your-writes: answer only once the write with this
  // commit_seq is visible; UNAVAILABLE / NOT_CAUGHT_UP after 2 s.
  int64 min_seq = 3;
  ItemFilter filter = 4;
  // Default 50, at most 500 (more is read as 500).
  int32 page_size = 5;
  // The previous page's next_page_token, with the same request otherwise.
  string page_token = 6;
}

message SearchItemsResponse {
  // Newest first (create time, then name).
  repeated Item items = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// Conditions on Items, all of which must hold. Within one list, any entry
// may match.
message ItemFilter {
  // Type names without a version, namespaces/{ns}/types/{type}: Items of
  // any version of these Types.
  repeated string types = 1;
  // State IDs.
  repeated string states = 2;
  // State categories, read in each Item's own Type version.
  repeated StateCategory categories = 3;
  // Conditions on field values. A field filter needs exactly one Type in
  // types, and the field must have one type in every version of it.
  repeated FieldFilter fields = 4;
  // Conditions on links: Items linked to (or from) an Item.
  repeated LinkFilter links = 5;
}

// Items with a link of this name to or from item, as the result Items see
// it: OUTGOING takes a declared name (Items that block item), INCOMING an
// inverse name (Items blocked by item). The name matches every Type that
// declares it in that direction. The item must be one the caller can see,
// else NOT_FOUND.
message LinkFilter {
  string link_type = 1;
  LinkDirection direction = 2;
  // namespaces/{ns}/items/{item}
  string item = 3;
}

// A condition on one field's value: eq, or a range of one or two bounds.
// Values are plain JSON as in Item.fields (an int is a string). Ranges are
// for ordered types only (int); strings, enums and booleans take eq.
//
// On a principal field, eq takes user:<id> or agent:<id>, or "me": the
// caller (for an agent, the user it acts for, else the agent).
message FieldFilter {
  // The field ID.
  string field = 1;
  google.protobuf.Value eq = 2;
  google.protobuf.Value gt = 3;
  google.protobuf.Value gte = 4;
  google.protobuf.Value lt = 5;
  google.protobuf.Value lte = 6;
}

message ListItemsRequest {
  // The container's name, namespaces/{ns}/items/{item}, for its direct
  // children; or namespaces/{ns} for the Items at the top level.
  string parent = 1;
  ItemFilter filter = 2;
  // As on SearchItemsRequest.
  int32 page_size = 3;
  string page_token = 4;
}

message ListItemsResponse {
  // Newest first (create time, then name).
  repeated Item items = 1;
  string next_page_token = 2;
}

message ListItemEventsRequest {
  // The Item's name, namespaces/{ns}/items/{item}.
  string parent = 1;
  // As on SearchItemsRequest.
  int32 page_size = 2;
  string page_token = 3;
}

message ListItemEventsResponse {
  // Oldest first, by item_seq.
  repeated ItemEvent events = 1;
  string next_page_token = 2;
}

// One accepted operation on an Item, as the caller may see it.
message ItemEvent {
  // namespaces/{ns}/items/{item}/events/{item_seq}
  string name = 1;
  int64 item_seq = 2;
  int64 commit_seq = 3;
  ItemEventKind kind = 4;
  google.protobuf.Timestamp create_time = 5;
  // Whose permissions were checked: user:, agent:, system:timer or a hook.
  string actor = 6;
  // The human at the root, when different from the actor.
  string on_behalf_of = 7;
  // Set when a timer or hook caused the write.
  string originating_hook = 8;
  // The event that caused this one, as "item:seq".
  string causation_id = 9;
  string correlation_id = 10;
  int32 hop = 11;

  // CREATED: the Type version and the first state.
  string type = 12;
  // TRANSITIONED, TRANSITION_DENIED, TRANSITION_FAILED and
  // TRANSITION_REQUESTED: the state left or held in.
  string from_state = 13;
  // TRANSITIONED, and CREATED (the first state).
  string to_state = 14;
  // TRANSITION_REQUESTED, TRANSITION_DENIED, TRANSITION_FAILED.
  string requested_state = 15;
  // The hold a held transition opened, resolved or canceled.
  string hold = 16;
  // HOOK_FAILED: the hook.
  string hook = 17;
  // TRANSITION_DENIED, TRANSITION_FAILED, HOOK_FAILED: a code.
  string reason = 18;

  // The fields this event set, with the values it set; a cleared field is
  // null. An erased value is not here: it is in erased_fields.
  google.protobuf.Struct fields = 19;
  // Fields this event set whose values have since been erased.
  repeated string erased_fields = 20;
  // A narrowing: the new readers. Anyone who sees the Item sees them.
  Readers readers = 21;
  // The Item dropped its own readers and inherits its container's again.
  bool inherit = 22;
  // CREATED in a container: the container.
  ItemRef container = 23;
  // A move: where from and where to; unset means the top level.
  bool moved = 24;
  ItemRef container_from = 25;
  ItemRef container_to = 26;
  // LINK_ADDED and LINK_REMOVED: the link's declared name and its target
  // (restricted when the caller cannot see it). Also TRANSITIONED, when the
  // transition set a link the kernel resolves.
  string link_type = 27;
  ItemRef link_target = 28;
  // UPDATED by a reaction: the amounts added to these fields (fields holds
  // the results).
  google.protobuf.Struct added = 29;
  // TRANSITIONED: the target a resolved link replaced.
  ItemRef link_replaced = 30;
  // REACTION_FAILED: the reaction, <type>:<id>; reason holds its code.
  string reaction = 31;
}

enum ItemEventKind {
  ITEM_EVENT_KIND_UNSPECIFIED = 0;
  ITEM_EVENT_KIND_CREATED = 1;
  // A field patch, a readers change or a move.
  ITEM_EVENT_KIND_UPDATED = 2;
  ITEM_EVENT_KIND_TRANSITIONED = 3;
  // A checked transition was asked for: a hold opened.
  ITEM_EVENT_KIND_TRANSITION_REQUESTED = 4;
  ITEM_EVENT_KIND_TRANSITION_DENIED = 5;
  ITEM_EVENT_KIND_TRANSITION_FAILED = 6;
  ITEM_EVENT_KIND_HOOK_FAILED = 7;
  // A link from this Item was added or removed.
  ITEM_EVENT_KIND_LINK_ADDED = 8;
  ITEM_EVENT_KIND_LINK_REMOVED = 9;
  // A link reaction could not be applied (an undo its target refused). It
  // is not retried.
  ITEM_EVENT_KIND_REACTION_FAILED = 10;
}

message StartAgentSessionRequest {
  // namespaces/{ns}: the agent's namespace.
  string parent = 1;
  // The user the agent acts for (user:ana), who must have granted it; empty
  // when it acts for itself. Not who is calling: that is the agent's token.
  string acting_for = 2;
  // Required: what the session may read and write. Each is a container's
  // name (the container and everything below it) or namespaces/{ns} (the
  // whole namespace). Within the agent's grant.
  repeated string scopes = 3;
  // Required: read, create, edit_fields, transition:<state> (may move Items
  // into that state) or transition:* (any), move, comment, outbound. read is
  // always implied. Within the agent's grant. v1 enforces read versus any
  // write power.
  repeated string powers = 4;
}

message StartAgentSessionResponse {
  AgentSession session = 1;
}

message AgentSession {
  // namespaces/{ns}/agentSessions/{id}
  string name = 1;
  // What the Pli-Agent-Session header carries.
  string id = 2;
  string agent = 3;
  string acting_for = 4;
  repeated string scopes = 5;
  repeated string powers = 6;
}

message ApproveWidenRequest {
  // namespaces/{ns}: the session's namespace.
  string parent = 1;
  // The agent session's ID.
  string session = 2;
  // The scope from the NEEDS_APPROVAL error's "scope" metadata: a
  // container's name, or namespaces/{ns}.
  string scope = 3;
  // Required, as on every write: the same request_id with the same request
  // answers as the first time and records nothing more; with a different
  // request it is ALREADY_EXISTS.
  string request_id = 4;
  // Check the approval and answer its audience, recording nothing
  // (AIP-163). request_id is not needed then.
  bool validate_only = 5;
  // The audience the approver was shown, as a validate_only call answered
  // it: "namespace" or "restricted". Required unless validate_only (ignored
  // then). If the audience is different when the approval commits, nothing
  // is approved: FAILED_PRECONDITION / AUDIENCE_CHANGED, with the current
  // "audience" and this "expected_audience" in metadata.
  string expected_audience = 6;
}

message ApproveWidenResponse {
  // Who the approval lets see the agent session's content: "namespace"
  // (everyone in the namespace: the scope is open) or "restricted" (the
  // readers of the scope's Item).
  string audience = 1;
}

// One version of a Type definition.
message Type {
  // namespaces/{ns}/types/{type}/versions/{n}
  string name = 1;
  string type_id = 2;
  int32 version = 3;
  string initial_state = 4;
  repeated Field fields = 5;
  repeated State states = 6;
  repeated Transition transitions = 7;
  // The link types Items of this version may have as sources.
  repeated LinkType link_types = 8;
  // Rules over the fields that every write must keep, on every door
  // (FAILED_PRECONDITION / INVARIANT_FAILED, metadata invariant).
  repeated Invariant invariants = 9;
  // Writes this version's transitions make on the Items its links point to.
  repeated Reaction reactions = 10;
  // Reactions of other Types that may write Items of this version, and the
  // fields each may write. Any other reaction is refused.
  repeated AcceptedReaction accepts_reactions = 11;
}

// A rule over an Item's fields. Its id is the refusal code: a write that
// would break it is refused naming it, and a held reaction refused by it is
// denied with it as the reason.
message Invariant {
  string id = 1;
  // A CEL expression over the fields; a rule that cannot be evaluated (a
  // null field) does not hold.
  string rule = 2;
}

// A link reaction: a write on a linked Item, run by the kernel when an
// Item enters a state. Its principal is reaction:<type>:<id>.
message Reaction {
  string id = 1;
  ReactionKind kind = 2;
  // Entering this state, from one of from_states (empty: from any).
  string state = 3;
  repeated string from_states = 4;
  // HELD: the declared link (at most one target) the reaction follows.
  string link_type = 5;
  // HELD: target field ID -> a CEL expression over this Item's fields
  // whose value (an int) is added to the target field.
  map<string, string> add = 6;
  // AFTER: the held reaction whose committed write this one reverses.
  string undoes = 7;
}

enum ReactionKind {
  REACTION_KIND_UNSPECIFIED = 0;
  // Holds the transition (TransitionItemRequest.wait matters): it applies
  // if the write on the target commits, and is denied with the target's
  // refusal code if not. Its undo gives back what it took if the hold
  // closes any other way.
  REACTION_KIND_HELD = 1;
  // Runs after the transition has committed, without holding it.
  REACTION_KIND_AFTER = 2;
}

// A reaction another Type may run on Items of this Type.
message AcceptedReaction {
  // <type>:<reaction id>, no version.
  string reaction = 1;
  // The fields it may write.
  repeated string fields = 2;
}

// A link type a Type declares: links from its Items to Items of the target
// Types.
message LinkType {
  // The name from the source (blocks) and from the target (blocked_by).
  string name = 1;
  string inverse = 2;
  // Type names without a version, namespaces/{ns}/types/{type}: a target
  // may be of any version of these Types.
  repeated string targets = 3;
  // At most one link of this type from a source; else many.
  bool max_one = 4;
  // At most one link of this type to a target; else many.
  bool inverse_max_one = 5;
  // KERNEL: only the kernel sets these links (resolve); LinkItems and
  // UnlinkItems refuse them (PERMISSION_DENIED / LINK_NOT_WRITABLE).
  FieldWriter writable_by = 6;
  // Set when the kernel sets the link itself on entering a state.
  LinkResolve resolve = 7;
}

// The kernel sets a link in the write that enters on_enter: to the unique
// Item of the link's target Type, in state `state`, whose principal field
// `field` holds the Item's creator. None or several refuse the entry
// (no_<link> or ambiguous_<link>; on a direct transition FAILED_PRECONDITION
// / LINK_UNRESOLVED).
message LinkResolve {
  string on_enter = 1;
  string field = 2;
  // What the field must equal: creator.
  string equals = 3;
  string state = 4;
}

message Field {
  string id = 1;
  FieldType type = 2;
  // Enum fields only: the allowed names.
  repeated string options = 3;
  // Who may write the field. UNSPECIFIED: anyone who may write the Item.
  FieldWriter writable_by = 4;
  // When set, only principals holding one of these roles write the field
  // through the public API (an agent and the user it acts for must both
  // hold one): PERMISSION_DENIED / FIELD_NOT_WRITABLE otherwise.
  repeated string writable_by_roles = 5;
}

// Who may write a field.
enum FieldWriter {
  // Anyone who may write the Item, through the public API.
  FIELD_WRITER_UNSPECIFIED = 0;
  // Only the kernel (hooks, through the internal door): the public API
  // refuses it on create, update and a transition's patch
  // (PERMISSION_DENIED / FIELD_NOT_WRITABLE).
  FIELD_WRITER_KERNEL = 1;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING = 1;
  FIELD_TYPE_INT = 2;
  FIELD_TYPE_BOOL = 3;
  FIELD_TYPE_ENUM = 4;
  // A principal: user:<id> or agent:<id>. It grants nothing.
  FIELD_TYPE_PRINCIPAL = 5;
  // A calendar date, as an ISO 8601 string: 2026-12-01.
  FIELD_TYPE_DATE = 6;
}

message State {
  string id = 1;
  StateCategory category = 2;
  // Field IDs no write may change while an Item is in this state
  // (FAILED_PRECONDITION / FIELD_FROZEN). The transition entering the state
  // may set them.
  repeated string frozen = 3;
}

enum StateCategory {
  STATE_CATEGORY_UNSPECIFIED = 0;
  STATE_CATEGORY_TRIAGE = 1;
  STATE_CATEGORY_BACKLOG = 2;
  STATE_CATEGORY_TODO = 3;
  STATE_CATEGORY_ACTIVE = 4;
  STATE_CATEGORY_WAITING = 5;
  STATE_CATEGORY_DONE = 6;
  STATE_CATEGORY_CANCELED = 7;
  // Not work: work views leave it out.
  STATE_CATEGORY_NONE = 8;
}

message Transition {
  string from_state = 1;
  string to_state = 2;
  // A CEL expression over the fields; empty when there is none.
  string guard = 3;
  // Field IDs that must be set.
  repeated string required = 4;
  // Who may make the move: role:<name>, principal:<id>, field:<id> (the
  // principal a principal field holds when the move is made), or creator
  // (the user the Item was created for, or an agent acting for them).
  // Empty: anyone who can see the Item.
  repeated string allowed = 5;
  // May leave a state while a hold is open on it (it cancels the hold).
  bool escape = 6;
  // A check runs before the move is applied: the transition is held, and
  // TransitionItemRequest.wait matters.
  bool checked = 7;
  // Who may not make the move, even if `allowed` names them: for now only
  // creator.
  repeated string except = 8;
}

message GetTypeRequest {
  // namespaces/{ns}/types/{type}/versions/{n}
  string name = 1;
}

message GetTypeResponse {
  Type type = 1;
}

message ListTypesRequest {
  // namespaces/{ns}
  string parent = 1;
}

message ListTypesResponse {
  // Ordered by type ID, then version.
  repeated Type types = 1;
}

message LinkItemsRequest {
  // The source Item, namespaces/{ns}/items/{item}.
  string name = 1;
  // Required; see CreateItemRequest.request_id.
  string request_id = 2;
  // Optional if-match on the source, as on UpdateItemRequest.
  string etag = 3;
  // Required: a link type the source's Type declares, by its declared name
  // (blocks, never blocked_by).
  string link_type = 4;
  // Required: the target Item, namespaces/{ns}/items/{item}.
  string target = 5;
}

message LinkItemsResponse {
  // The source Item after the write.
  Item item = 1;
  int64 item_seq = 2;
  int64 commit_seq = 3;
}

message UnlinkItemsRequest {
  // As on LinkItemsRequest.
  string name = 1;
  string request_id = 2;
  string etag = 3;
  string link_type = 4;
  string target = 5;
}

message UnlinkItemsResponse {
  Item item = 1;
  int64 item_seq = 2;
  int64 commit_seq = 3;
}
