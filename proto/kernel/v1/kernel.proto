syntax = "proto3";

// First cut of the kernel API, from docs/design.md.
// Step 1 implements Create and Get as Go functions only; no server yet.
// Requests for later steps hold only what the design already states.
package kernel.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/francoisnyc/work-kernel/gen/kernel/v1;kernelv1";

service ItemService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Transition(TransitionRequest) returns (TransitionResponse);
  rpc Link(LinkRequest) returns (LinkResponse);
  rpc Archive(ArchiveRequest) returns (ArchiveResponse);
  rpc Get(GetRequest) returns (GetResponse);
  // Search waits until min_seq is visible before answering.
  rpc Search(SearchRequest) returns (SearchResponse);
}

// Who is acting. Opaque IDs only.
message Principal {
  string actor = 1;
  string on_behalf_of = 2; // empty when the actor acts for itself
}

message WriteResult {
  string item_id = 1;
  int64 commit_seq = 2;
  int64 item_seq = 3;
}

message Item {
  string id = 1;
  string type_id = 2;
  int32 type_version = 3;
  string container_id = 4;
  string scope_id = 5;
  string state = 6;
  google.protobuf.Struct fields = 7; // keyed by stable field ID
  int64 item_seq = 8;
  Hold hold = 9; // the latest hold, if the Item ever had one
}

// A request for a checked transition, held while its check runs.
message Hold {
  string id = 1;
  string hook = 2;       // the check hook's ID
  string from_state = 3; // the state the Item is held in
  string to_state = 4;   // the state requested
  HoldStatus status = 5;
  string reason = 6;     // a code, set when denied or error
}

enum HoldStatus {
  HOLD_STATUS_UNSPECIFIED = 0;
  HOLD_STATUS_OPEN = 1;
  HOLD_STATUS_ALLOWED = 2;
  HOLD_STATUS_DENIED = 3;
  HOLD_STATUS_ERROR = 4;
  HOLD_STATUS_CANCELED = 5;
}

message CreateRequest {
  string idempotency_key = 1;
  Principal principal = 2;
  string type_id = 3;
  int32 type_version = 4;
  string state = 5; // initial state; chosen by the Type from Step 2 on
  google.protobuf.Struct fields = 6;
  string container_id = 7;
}
message CreateResponse {
  WriteResult result = 1;
}

message UpdateRequest {
  string idempotency_key = 1;
  Principal principal = 2;
  string item_id = 3;
  google.protobuf.Struct fields = 4;
  // Optional if-match: write only if the Item is still at this item_seq.
  // Zero means no check. A mismatch is "stale": re-read and retry.
  int64 expected_item_seq = 5;
}
message UpdateResponse {
  WriteResult result = 1;
}

message TransitionRequest {
  string idempotency_key = 1;
  Principal principal = 2;
  string item_id = 3;
  string to_state = 4;
  // Optional patch, applied before the guards are checked; recorded with the
  // transition as one event. Same meaning as UpdateRequest.fields.
  google.protobuf.Struct fields = 5;
  // Optional if-match, as on UpdateRequest.
  int64 expected_item_seq = 6;
  // How long to wait for a held transition's check: 0 (the default) answers
  // at once; at most 5 s. Not part of the request's identity: a retry with
  // the same key may wait more or less, and gets the hold's current outcome.
  google.protobuf.Duration wait = 7;
}
message TransitionResponse {
  // For a held transition: the resolving event once there is one, else the
  // request's.
  WriteResult result = 1;
  TransitionOutcome outcome = 2;
  string hold_id = 3; // set when the transition was held
  string reason = 4;  // a code, for denied and error
}

enum TransitionOutcome {
  TRANSITION_OUTCOME_UNSPECIFIED = 0;
  TRANSITION_OUTCOME_APPLIED = 1; // the Item moved
  TRANSITION_OUTCOME_DENIED = 2;  // the check, or a re-check of the requester, said no
  TRANSITION_OUTCOME_PENDING = 3; // the hold is still open; ask again with the same key
  TRANSITION_OUTCOME_ERROR = 4;   // the check could not answer; ask again to retry
}

message LinkRequest {
  string idempotency_key = 1;
  Principal principal = 2;
  string item_id = 3;
  string target_item_id = 4;
  string link_type = 5;
}
message LinkResponse {
  WriteResult result = 1;
}

message ArchiveRequest {
  string idempotency_key = 1;
  Principal principal = 2;
  string item_id = 3;
}
message ArchiveResponse {
  WriteResult result = 1;
}

message GetRequest {
  Principal principal = 1;
  string item_id = 2;
}
message GetResponse {
  Item item = 1;
}

message SearchRequest {
  Principal principal = 1;
  string query = 2;
  int64 min_seq = 3;
}
message SearchResponse {
  repeated Item items = 1;
}
