# Bake-off 2: what the plain-Temporal side runs on (throwaway; local only).
# Its own Postgres and Temporal development server, apart from the kernel
# side's (spikes/camunda-bakeoff/compose.yaml, profile kernel), so each
# side's footprint is its own. The program itself (cmd/ptapp) runs on the
# host: see README.md.
name: bakeoff2

services:
  plain-postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: plain, POSTGRES_PASSWORD: plain, POSTGRES_DB: plain}
    ports: ["127.0.0.1:25432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plain -d plain"]
      interval: 2s
      timeout: 2s
      retries: 30

  plain-temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["127.0.0.1:27233:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
