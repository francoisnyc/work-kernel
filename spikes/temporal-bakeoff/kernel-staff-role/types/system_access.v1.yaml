# Bake-off 2, the staff-role run: what is asked and the reason are writable
# only by holders of role staff. Edited in place for track 1 item 4 (only the
# requester edits a draft, the owner's decision): the draft's requester_only
# line. Each run registers it fresh.
#
# Bake-off: the second approval kind, an access request (system, role,
# justification), made inside the system it asks for and decided by the
# system's owner. Submitting copies the owner from the system, in the same
# write: a request outside a system cannot be submitted (the invariant).
# The agent prepares it as it prepares a purchase.
#
# Edited in place for track 1 item 3 (required means given by the mover,
# the owner's decision): each rejection gains given: [f_reason], so a
# reason written before the decision, by anyone, does not count. Each
# run registers it fresh.
id: system_access
version: 1
initial_state: draft

fields:
  - {id: f_system_name,   type: string,    writable_by: kernel}
  - {id: f_owner,         type: principal, writable_by: kernel}
  - {id: f_role,          type: string,    writable_by: ['role:staff']}
  - {id: f_justification, type: string,    writable_by: ['role:staff']}
  - {id: f_summary,       type: string,    writable_by: ['role:preparer']}
  - {id: f_policy,        type: enum, options: [ok, check, fail], writable_by: ['role:preparer']}
  - {id: f_flags,         type: string,    writable_by: ['role:preparer']}
  - {id: f_reason,        type: string,    writable_by: ['role:staff']}

states:
  - {id: draft, category: todo, requester_only: [f_role, f_justification]}
  - id: owner_review
    category: waiting
    frozen: [f_system_name, f_owner, f_role, f_justification]
  - id: approved
    category: done
    frozen: [f_system_name, f_owner, f_role, f_justification, f_summary, f_policy, f_flags, f_reason]
  - id: rejected
    category: canceled
    frozen: [f_system_name, f_owner, f_role, f_justification, f_summary, f_policy, f_flags, f_reason]

transitions:
  - from: draft
    to: owner_review
    allowed: [creator]
    required: [f_role, f_justification]
    sets:
      f_owner: 'container.f_owner'
      f_system_name: 'container.f_name'
  - {from: owner_review, to: approved, allowed: ['field:f_owner'], except: [creator]}
  - {from: owner_review, to: rejected, allowed: ['field:f_owner'], except: [creator], required: [f_reason], given: [f_reason]}

invariants:
  - {id: no_owner, rule: 'f_system_name == null || f_owner != null'}

hooks:
  - {id: notify_rejected, on: enter, state: rejected, kind: action, action: email.notify, reads: [creator]}

placement_writable_by: [kernel]
