version: v2
# The TypeScript client of the web UI (web/src/gen, committed; CI checks it
# is current): make gen-web. Kept apart from buf.gen.yaml so that `make gen`
# and the Go tests need no Node. The plugin is the one web/package-lock.json
# pins: run `npm ci` in web/ first.
inputs:
  - directory: proto
  # google.rpc.ErrorInfo and BadRequest, to read the server's refusals.
  - directory: web/proto-vendor
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
clean: true
