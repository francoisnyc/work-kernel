# The whole proof-of-concept stack: docker compose up -d --build --wait
#
# Postgres, the Temporal dev server, a one-shot migration, the item service
# (the public API), the relay, the worker, stub CRM/ERP/HR/email
# connectors, the web UI and the PoC apps. Published, all on 127.0.0.1
# only: the API (8080), the web UI (8090) and the PoC apps (8091) (dev
# tokens are the only auth, and the web and poc containers serve the
# dev-token file), the Temporal UI (8233, which shows
# workflow histories and can terminate and signal workflows) and, dev only,
# the email stub's read-only port (8085) for the scenario;
# compose.dev.yaml also publishes Postgres and Temporal's gRPC port, local
# only too, for work on the code.
#
# This is a dev stack: its worker runs vacation_request on a DEV CLOCK (a
# day of its timers lasts 2 s), so the scenario can watch reminders and an
# expiry. It warns on every start. Never run a worker so in production.
#
# The Temporal dev server keeps its state in memory: reset the stack as a
# whole (docker compose down -v), never one service.
name: pli

x-database: &database
  DATABASE_URL: postgres://kernel:kernel@postgres:5432/kernel?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: kernel
      POSTGRES_DB: kernel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernel -d kernel"]
      interval: 2s
      timeout: 2s
      retries: 30

  temporal:
    # The image's entrypoint is the temporal CLI: this runs
    # `temporal server start-dev`.
    image: temporalio/temporal:1.10.0 # CLI 1.10.0, Server 1.32.2
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:8233:8233" # Temporal web UI, local only (it can terminate and signal workflows)
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Applies the migrations, then exits; the services below start only once
  # it has succeeded.
  migrate:
    build: {context: ., target: migrate}
    environment: *database
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  itemservice:
    build: {context: ., target: itemservice}
    # Dev tokens are the proof of concept's only auth: the server warns about
    # them on every start. The file is mounted read-only.
    command: ["--dev-tokens", "/etc/pli/dev-tokens.yaml", "--types", "/types", "--listen", ":8080"]
    volumes:
      - ./dev-tokens.example.yaml:/etc/pli/dev-tokens.yaml:ro
    environment: *database
    ports:
      # The public API, on this machine only: with dev tokens as its only
      # auth it must not be reachable from the network (compose otherwise
      # publishes on every interface).
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/itemservice", "--probe", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The web UI (web/): the built site, with /api proxied to the item
  # service. DEV ONLY parts: the build arg compiles the "act as" picker in,
  # and the dev-token file is mounted read-only where nginx serves it, so
  # the picker can offer every dev user. That hands every dev token to
  # whoever can reach the port: it is published on 127.0.0.1 only.
  web:
    build:
      context: ./web
      args: {VITE_DEV_USERS: "1"}
    volumes:
      - ./dev-tokens.example.yaml:/usr/share/nginx/html/dev-tokens.yaml:ro
    ports:
      - "127.0.0.1:8090:8080" # the web UI: http://localhost:8090
    depends_on:
      itemservice: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The PoC apps (apps/poc): the tracker, the service desk and the customer
  # portal, built on the public API like web/, which stays the admin view.
  # Its build reads web/'s generated client and rank port, read-only, as
  # two more build contexts. DEV ONLY parts, as for web: the build arg
  # compiles the sign-in list in, and the dev-token file is mounted where
  # nginx serves it, so the port hands out every dev token: it is
  # published on 127.0.0.1 only.
  poc:
    build:
      context: ./apps/poc
      additional_contexts:
        webgen: ./web/src/gen
        webrank: ./web/src/rank
      args: {VITE_DEV_USERS: "1"}
    volumes:
      - ./dev-tokens.example.yaml:/usr/share/nginx/html/dev-tokens.yaml:ro
    ports:
      - "127.0.0.1:8091:8080" # the PoC apps: http://localhost:8091
    depends_on:
      itemservice: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30

  relay:
    build: {context: ., target: relay}
    environment:
      <<: *database
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}

  worker:
    build: {context: ., target: worker}
    # DEV ONLY: vacation_request's declared timers on a scaled clock (a day
    # lasts 2 s); every other Type, and every budget, keeps real time.
    command: ["--dev-time-scale", "2s", "--dev-clock-i-know-this-is-not-production",
              "--dev-time-scale-types", "vacation_request"]
    environment:
      <<: *database
      TEMPORAL_ADDRESS: temporal:7233
      CRM_URL: http://connstub:8081
      ERP_URL: http://connstub:8082
      HR_URL: http://connstub:8083
      EMAIL_URL: http://connstub:8084
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      connstub: {condition: service_healthy}
      # The dev clock checks the Types it names against those loaded.
      itemservice: {condition: service_healthy}

  # Stub CRM (8081) and ERP (8082) for the ticket's hooks. The ERP answers
  # after 1 s, so a held approve stays held long enough to see. The stub HR
  # directory (8083), for the vacation request's HR check, answers at once.
  # The email stub (8084) records the vacation request's emails; its
  # read-only port (8085, GET /messages?item=) is published for the
  # scenario, dev only: nothing outside the stack can send.
  connstub:
    build: {context: ., target: connstub}
    command: ["--crm-listen", ":8081", "--erp-listen", ":8082", "--erp-latency", "1s",
              "--customers", "/etc/connstub/customers.json",
              "--hr-listen", ":8083", "--hr-directory", "/etc/connstub/hr-directory.json",
              "--email-listen", ":8084", "--email-read-listen", ":8085"]
    ports:
      - "127.0.0.1:8085:8085" # dev only: the sent emails, read-only, local only
    volumes:
      - ./deploy/customers.json:/etc/connstub/customers.json:ro
      - ./deploy/hr-directory.json:/etc/connstub/hr-directory.json:ro
    healthcheck:
      test: ["CMD", "/connstub", "--probe", "http://localhost:8082/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
